services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_NAME: Ottoman Express
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: "false"
      APP_URL: https://ottoman.express
      ASSET_URL: https://ottoman.express
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-tastyigniter}
      DB_USERNAME: ${DB_USERNAME:-tastyigniter}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      SESSION_LIFETIME: "120"
      SESSION_SECURE_COOKIE: "true"
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: noreply@ottoman.express
      MAIL_FROM_NAME: Ottoman Express
      PHP_MEMORY_LIMIT: 512M
      PHP_POST_MAX_SIZE: 32M
      PHP_UPLOAD_MAX_FILE_SIZE: 32M
      PHP_OPCACHE_ENABLE: "1"
      LOG_CHANNEL: stderr
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - private
      - dokploy-network

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tastyigniter}
      MYSQL_USER: ${DB_USERNAME:-tastyigniter}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - database-data:/var/lib/mysql
    networks:
      - private

networks:
  private:
    internal: true
  dokploy-network:
    external: true

volumes:
  app-storage:
  database-data:
